name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    # Real Postgres + pgvector, matching the production image in docker-compose.yml.
    # Per project rules, SQLite is never a substitute for Postgres validation - this is
    # the actual target database, running for real in CI.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deepinsight_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/deepinsight_ci
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/deepinsight_ci
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      CLERK_ISSUER: https://test.clerk.dev
      CLERK_AUDIENCE: test-audience
      ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS1mb3ItY2ktb25seS0hISE=
    defaults:
      run:
        working-directory: apps/backend
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: apps/backend/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff psycopg[binary]

    - name: Import check (fails fast on the class of bug that broke the app for real)
      run: |
        python -c "import api.models"
        python -c "from api.main import app"

    - name: Lint
      run: ruff check .

    - name: Verify migrations apply to a clean Postgres (upgrade -> downgrade -> upgrade)
      run: |
        alembic upgrade head
        alembic downgrade -1
        alembic upgrade head

    - name: Run tests
      run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: apps/frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run typecheck

    - name: Build
      run: npm run build
