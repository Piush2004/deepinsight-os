[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Correctness-focused ruleset: undefined names, unused imports/vars, obvious bugs.
# Deliberately not enabling pyupgrade/RUF/style rules across a codebase that predates
# ruff - that would be hundreds of pre-existing stylistic findings unrelated to
# correctness, which would make CI noisy enough that failures get ignored.
select = ["E", "F"]
ignore = [
    "E501",  # line length - not a correctness issue
    "E712",  # `Column == False` is the correct SQLAlchemy filter idiom, not a bool
             # comparison - `not Column` would raise at runtime, so this rule is a
             # false positive throughout every repository/router filter in this codebase.
    "E402",  # a handful of pre-existing files (api/main.py, alembic/env.py,
             # api/core/security.py) import mid-file by design (e.g. after
             # fileConfig()/logging setup runs, or to avoid an import cycle) - imports
             # work correctly regardless of position in Python, this is style-only.
]
